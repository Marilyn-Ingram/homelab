---
- name: Install MySQL and the Python library Ansible uses to manage it
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present

- name: Listen on the private network, not just localhost
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: "bind-address = 0.0.0.0"
  notify: Restart MySQL

- name: Make sure MySQL is running and starts on boot
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Create the WordPress database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create the WordPress user, allowed only from the lab subnet
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ lab_subnet_pattern }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true
